databases:
  # Snowflake connection, with values written straight into this file.
  # Spellbook warns about hardcoded credentials, so prefer the next example.
  - name: snowflake_example
    type: snowflake
    account: your_account
    user: snowflake_user_name
    password: snowflake_password # Optional when a private key is given
    private_key: snowflake_pk # Base64-encoded; used in preference to the password
    private_key_passphrase: snowflake_pk_phrase # Optional, omit if the key has none
    role: snowflake_role
    warehouse: snowflake_warehouse
    database: snowflake_database
    schema: snowflake_schema # Optional, defaults to 'public'

  # The same connection, reading its sensitive values from environment variables.
  - name: snowflake_env_example
    type: snowflake
    account: ${SNOWFLAKE_ACCOUNT}
    user: ${SNOWFLAKE_USER}
    password: ${SNOWFLAKE_PASSWORD}
    private_key: ${SNOW_PK}
    private_key_passphrase: ${SNOW_PK_PASSPHRASE} # Optional
    role: snowflake_role
    warehouse: snowflake_warehouse
    database: snowflake_database
    schema: snowflake_schema

  # MySQL connection using a stored password.
  - name: mysql_example
    type: mysql
    host: your_host
    port: 3306 # Optional, defaults to 3306
    user: mysql_user_name
    password: ${MYSQL_PASSWORD}
    database: mysql_database

  # MySQL connection using AWS RDS IAM authentication, so no password is stored.
  # Spellbook fetches a temporary token on every connection, because they expire
  # after about 15 minutes. Requires the `rx` CLI, which is Fullscript internal tooling.
  - name: mysql_iam_example
    type: mysql
    host: ${MYSQL_HOST} # e.g. your-instance.abc123.us-east-1.rds.amazonaws.com
    port: 3306
    iam_auth: true # Use an AWS RDS IAM token instead of a password
    rds_db_name: your_rds_instance_name # Optional, as named by `rx rds list`; defaults to `name`
    database: ${MYSQL_DATABASE}
    # No `user` is needed: the token names the user it was issued for. Set one only to
    # pin it, in which case it has to match the token.
    # The connection is always encrypted. Add `ssl_ca` only to verify the server
    # certificate as well - see documentation/db_magic.md for the caveats.

google_accounts:
  # Google Sheets Service Account 1
  - name: google_sheets_service_account_1
    service_account: "your_base64_encoded_service_account_credentials_here"  # Add your Base64-encoded service account JSON here
  # Google Sheets Service Account 2
  - name: google_sheets_service_account_2
    service_account: "your_base64_encoded_service_account_credentials_here"
